<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя страница</title>
    <style>
        /* Убираем отступы, чтобы фото прилипло к краям */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000; /* Черный фон, если фото не загрузится */
        }
        
        /* Делаем так, чтобы фото занимало весь экран */
        .full-screen-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Картинка заполнит экран, не искажая пропорции */
            display: block;
        }
    </style>
</head>
<body>

    <!-- Здесь мы указываем путь к нашей картинке -->
    <img src="photo.jpg" alt="Мое фото" class="full-screen-img">

</body>
</html>
